name: 🔐 Secure Builds
on:
  workflow_dispatch:

concurrency:
  group: secure-builds|${{ github.ref_name }}
  cancel-in-progress: true

env:
  SCONS_FLAGS: >-
    dev_mode=yes
    module_text_server_fb_enabled=yes
  SCRIPT_AES256_ENCRYPTION_KEY: ${{ secrets.SCRIPT_AES256_ENCRYPTION_KEY }}
  SECURE_SCRIPT_URL: https://github.com/KnifeXRage/Godot-Secure/releases/download/Beta-v5_Universal/Godot.Secure.Camellia-256.Universal.v5-Beta.py

jobs:
  secure-build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux Editor
            cache-name: secure-linux-editor
            runs-on: ubuntu-22.04
            target: editor
            platform: linuxbsd
            scons-flags: compiledb=yes
            artifact: true

          - name: Linux Release Template
            cache-name: secure-linux-template-release
            runs-on: ubuntu-22.04
            target: template_release
            platform: linuxbsd
            artifact: true

          - name: Windows Editor
            cache-name: secure-windows-editor
            runs-on: windows-latest
            target: editor
            platform: windows
            scons-flags: windows_subsystem=console d3d12=no
            artifact: true

          - name: Windows Release Template
            cache-name: secure-windows-template-release
            runs-on: windows-latest
            target: template_release
            platform: windows
            scons-flags: windows_subsystem=console d3d12=no
            artifact: true

          - name: macOS Editor
            cache-name: secure-macos-editor
            runs-on: macos-26
            target: editor
            platform: macos
            artifact: true

          - name: Android arm64 Template
            cache-name: secure-android-arm64
            runs-on: ubuntu-24.04
            target: template_debug
            platform: android
            scons-flags: arch=arm64
            artifact: true

          - name: iOS Template
            cache-name: secure-ios
            runs-on: macos-26
            target: template_release
            platform: ios
            artifact: true

          - name: Web 64-bit Template
            cache-name: secure-web
            runs-on: ubuntu-24.04
            target: template_release
            platform: web
            scons-flags: threads=yes arch=wasm64 use_closure_compiler=yes
            artifact: true

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up Java 17
        if: matrix.platform == 'android'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Emscripten
        if: matrix.platform == 'web'
        uses: emscripten-core/setup-emsdk@v16
        with:
          version: 4.0.11
          no-cache: true

      - name: Setup Python and SCons
        uses: ./.github/actions/godot-deps

      - name: Download pre-built AccessKit
        if: matrix.platform == 'linuxbsd' || matrix.platform == 'windows' || matrix.platform == 'macos'
        shell: sh
        id: accesskit-sdk
        run: |
          if python ./misc/scripts/install_accesskit.py; then
            echo "ACCESSKIT_ENABLED=yes" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::AccessKit SDK installation failed, building without AccessKit support."
            echo "ACCESSKIT_ENABLED=no" >> "$GITHUB_OUTPUT"
          fi

      - name: Download pre-built ANGLE
        if: matrix.platform == 'windows' || matrix.platform == 'macos'
        shell: sh
        id: angle-sdk
        run: |
          if python ./misc/scripts/install_angle.py; then
            echo "ANGLE_ENABLED=yes" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::ANGLE SDK installation failed, building without ANGLE support."
            echo "ANGLE_ENABLED=no" >> "$GITHUB_OUTPUT"
          fi

      - name: Download Swappy
        if: matrix.platform == 'android'
        run: python ./misc/scripts/install_swappy_android.py

      - name: Apply Godot Secure (Camellia-256)
        shell: bash
        env:
          PYTHONUTF8: 1
          SCRIPT_AES256_ENCRYPTION_KEY: ${{ secrets.SCRIPT_AES256_ENCRYPTION_KEY }}
        run: |
          python -c "import urllib.request; urllib.request.urlretrieve('${{ env.SECURE_SCRIPT_URL }}', 'godot_secure.py')" || {
            echo "::error::Failed to download Godot Secure script"
            exit 1
          }
          secure_token="$(printf '%s' "$SCRIPT_AES256_ENCRYPTION_KEY" | sha256sum | cut -c1-64)"
          printf 'y\nn\nn\nn\n' | python godot_secure.py . || true
          token_bytes=""
          while IFS= read -r byte; do token_bytes+="0x${byte}, "; done < <(printf '%s' "$secure_token" | fold -w2)
          sed -E 's|^#define PACK_HEADER_MAGIC .*|#define PACK_HEADER_MAGIC 0x43504447|' core/io/file_access_pack.h > core/io/file_access_pack.h.tmp && mv core/io/file_access_pack.h.tmp core/io/file_access_pack.h
          sed -E 's|^#define ENCRYPTED_HEADER_MAGIC .*|#define ENCRYPTED_HEADER_MAGIC 0x43454447|' core/io/file_access_encrypted.h > core/io/file_access_encrypted.h.tmp && mv core/io/file_access_encrypted.h.tmp core/io/file_access_encrypted.h
          sed -E "s|^    static const uint8_t TOKEN\[32\].*|    static const uint8_t TOKEN[32] = { $token_bytes };|" core/crypto/security_token.h > core/crypto/security_token.h.tmp && mv core/crypto/security_token.h.tmp core/crypto/security_token.h
          if [ ! -f "core/crypto/security_token.h" ]; then
            echo "::error::Godot Secure script failed to create security_token.h"
            exit 1
          fi

      - name: Patch camellia header for cross-platform build
        shell: bash
        run: |
          python -c "
          import pathlib
          p = pathlib.Path('core/crypto/crypto_core.cpp')
          t = p.read_text()
          camellia_include = '#define MBEDTLS_DECLARE_PRIVATE_IDENTIFIERS\n#include <mbedtls/private/camellia.h>'
          if camellia_include not in t:
              marker = '#include <mbedtls/base64.h>'
              if marker not in t:
                  raise SystemExit('Could not find the mbedTLS include anchor')
              t = t.replace(marker, marker + '\n' + camellia_include, 1)
          p.write_text(t)
          "
          if ! grep -Fq '#include <mbedtls/private/camellia.h>' core/crypto/crypto_core.cpp; then
            echo '::error::Failed to patch camellia header'
            exit 1
          fi

      - name: Restore Godot build cache
        uses: ./.github/actions/godot-cache-restore
        with:
          cache-name: ${{ matrix.cache-name }}
        continue-on-error: true

      - name: Compilation (macOS x86_64)
        if: matrix.platform == 'macos'
        uses: ./.github/actions/godot-build
        with:
          scons-flags: ${{ env.SCONS_FLAGS }} ${{ matrix.scons-flags }} arch=x86_64 accesskit=${{ steps.accesskit-sdk.outputs.ACCESSKIT_ENABLED }} angle=${{ steps.angle-sdk.outputs.ANGLE_ENABLED }} metal=no vulkan=no
          platform: macos
          target: ${{ matrix.target }}

      - name: Compilation (macOS arm64)
        if: matrix.platform == 'macos'
        uses: ./.github/actions/godot-build
        with:
          scons-flags: ${{ env.SCONS_FLAGS }} ${{ matrix.scons-flags }} arch=arm64 accesskit=${{ steps.accesskit-sdk.outputs.ACCESSKIT_ENABLED }} angle=${{ steps.angle-sdk.outputs.ANGLE_ENABLED }} vulkan=no
          platform: macos
          target: ${{ matrix.target }}

      - name: Compilation
        if: matrix.platform != 'macos'
        uses: ./.github/actions/godot-build
        with:
          scons-flags: ${{ env.SCONS_FLAGS }} ${{ matrix.scons-flags }}
          platform: ${{ matrix.platform }}
          target: ${{ matrix.target }}

      - name: Save Godot build cache
        uses: ./.github/actions/godot-cache-save
        with:
          cache-name: ${{ matrix.cache-name }}
        continue-on-error: true

      - name: Prepare artifact (macOS)
        if: matrix.platform == 'macos' && matrix.artifact
        run: |
          lipo -create ./bin/godot.macos.${{ matrix.target }}.x86_64 ./bin/godot.macos.${{ matrix.target }}.arm64 -output ./bin/godot.macos.${{ matrix.target }}.universal
          rm ./bin/godot.macos.${{ matrix.target }}.x86_64 ./bin/godot.macos.${{ matrix.target }}.arm64
          rm -rf ./bin/build_deps
          strip bin/godot.*
          chmod +x bin/godot.*

      - name: Prepare artifact (Linux)
        if: matrix.platform == 'linuxbsd' && matrix.artifact
        run: |
          rm -rf ./bin/build_deps
          strip bin/godot.*
          chmod +x bin/godot.*

      - name: Prepare artifact (Windows)
        if: matrix.platform == 'windows' && matrix.artifact
        run: |
          Remove-Item bin/build_deps -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item bin/* -Include *.exp,*.lib,*.pdb -Force

      - name: Generate Android templates
        if: matrix.platform == 'android' && matrix.target == 'template_debug'
        run: |
          cd platform/android/java
          ./gradlew generateGodotTemplates
          cd ../../..

      - name: Upload artifact
        uses: ./.github/actions/upload-artifact
        if: matrix.artifact
        with:
          name: gdkey-${{ matrix.cache-name }}
