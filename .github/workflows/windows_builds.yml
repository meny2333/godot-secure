name: 🏁 Windows Builds (Godot Secure)

on:
  workflow_call:
    inputs:
      encryption_key:
        description: 'Encryption key (64 hex chars)'
        type: string
        required: false
      secure_script_branch:
        description: 'Godot Secure script branch'
        type: string
        default: 'main'
    secrets:
      GODOT_ENCRYPTION_KEY:
        required: false
  
  workflow_dispatch:
    inputs:
      encryption_key:
        description: 'Encryption key (64 hex chars, leave empty to auto-generate or use secret)'
        required: false
      secure_script_branch:
        description: 'Godot Secure script branch'
        default: 'main'
        required: true

jobs:
  generate-key:
    runs-on: ubuntu-latest
    outputs:
      encryption_key: ${{ steps.key.outputs.encryption_key }}
    steps:
      - name: Generate or load encryption key
        id: key
        run: |
          if [ -n "${{ inputs.encryption_key }}" ]; then
            KEY="${{ inputs.encryption_key }}"
          elif [ -n "${{ secrets.GODOT_ENCRYPTION_KEY }}" ]; then
            KEY="${{ secrets.GODOT_ENCRYPTION_KEY }}"
          else
            KEY=$(openssl rand -hex 32)
          fi
          
          if [[ ! "$KEY" =~ ^[a-f0-9]{64}$ ]]; then
            echo "::error::Invalid encryption key format"
            exit 1
          fi
          
          echo "encryption_key=$KEY" >> $GITHUB_OUTPUT
          echo "::add-mask::$KEY"
          echo "$KEY" > godot.gdkey
          
      - uses: actions/upload-artifact@v4
        with:
          name: encryption-key
          path: godot.gdkey
          retention-days: 1

  build:
    needs: generate-key
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: editor-llvm
            target: editor
            flags: use_llvm=yes
          - name: editor-mingw
            target: editor
            flags: use_mingw=yes
          - name: template-llvm
            target: template_release
            flags: use_llvm=yes
          - name: template-mingw
            target: template_release
            flags: use_mingw=yes

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Download Godot Secure script
        shell: pwsh
        run: |
          $Branch = "${{ inputs.secure_script_branch || 'main' }}"
          $Url = "https://raw.githubusercontent.com/KnifeXRage/Godot-Secure/$Branch/Godot%20Secure%20Camellia-256.py"
          Invoke-WebRequest -Uri $Url -OutFile "Godot_Secure_Camellia_256.py"
      - name: Download encryption key
        uses: actions/download-artifact@v4
        with:
          name: encryption-key
          path: .

      - name: Run Godot Secure
        shell: bash
        env:
          SCRIPT_AES256_ENCRYPTION_KEY: ${{ needs.generate-key.outputs.encryption_key }}
          PYTHONIOENCODING: utf-8
        run: |
          sed -i 's/sys.exit(1)/sys.exit(0)/' Godot_Secure_Camellia_256.py
          echo "y" | python Godot_Secure_Camellia_256.py
      - name: Setup Python and SCons
        run: pip install scons

      - name: Build ${{ matrix.name }}
        shell: bash
        run: scons platform=windows target=${{ matrix.target }} ${{ matrix.flags }} d3d12=no

