name: 🏁 Windows Builds (Godot Secure)

on:
  workflow_call:
    inputs:
      encryption_key:
        description: 'Encryption key (64 hex chars)'
        type: string
        required: false
      secure_script_branch:
        description: 'Godot Secure script branch'
        type: string
        default: 'main'
    secrets:
      GODOT_ENCRYPTION_KEY:
        required: false
  
  workflow_dispatch:
    inputs:
      encryption_key:
        description: 'Encryption key (64 hex chars, leave empty to auto-generate or use secret)'
        required: false
      secure_script_branch:
        description: 'Godot Secure script branch'
        default: 'main'
        required: true

jobs:
  generate-key:
    runs-on: ubuntu-latest
    outputs:
      encryption_key: ${{ steps.key.outputs.encryption_key }}
    steps:
      - name: Generate or load encryption key
        id: key
        run: |
          if [ -n "${{ inputs.encryption_key }}" ]; then
            KEY="${{ inputs.encryption_key }}"
          elif [ -n "${{ secrets.GODOT_ENCRYPTION_KEY }}" ]; then
            KEY="${{ secrets.GODOT_ENCRYPTION_KEY }}"
          else
            KEY=$(openssl rand -hex 32)
          fi
          
          if [[ ! "$KEY" =~ ^[a-f0-9]{64}$ ]]; then
            echo "::error::Invalid encryption key format"
            exit 1
          fi
          
          echo "encryption_key=$KEY" >> $GITHUB_OUTPUT
          echo "::add-mask::$KEY"
          echo "$KEY" > godot.gdkey
          
      - uses: actions/upload-artifact@v4
        with:
          name: encryption-key
          path: godot.gdkey
          retention-days: 1

  build-editor:
    needs: generate-key
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Download Godot Secure script
        shell: pwsh
        run: |
          $Branch = "${{ inputs.secure_script_branch || 'main' }}"
          $Url = "https://raw.githubusercontent.com/KnifeXRage/Godot-Secure/$Branch/Godot%20Secure%20Camellia-256.py"
          Invoke-WebRequest -Uri $Url -OutFile "Godot_Secure_Camellia_256.py"

      - name: Download encryption key
        uses: actions/download-artifact@v4
        with:
          name: encryption-key
          path: .

      - name: Run Godot Secure
        shell: pwsh
        env:
          SCRIPT_AES256_ENCRYPTION_KEY: ${{ needs.generate-key.outputs.encryption_key }}
        run: |
          (Get-Content Godot_Secure_Camellia_256.py) -replace 'sys.exit\(1\)', 'sys.exit(0)' | Set-Content Godot_Secure_Camellia_256.py
          echo "y" | python Godot_Secure_Camellia_256.py

      - name: Build Editor
        shell: bash
        run: scons platform=windows target=editor use_llvm=yes use_mingw=yes

      - name: Upload Editor Artifact
        uses: actions/upload-artifact@v4
        with:
          name: godot-editor-windows
          path: bin/

  build-template:
    needs: generate-key
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Download Godot Secure script
        shell: pwsh
        run: |
          $Branch = "${{ inputs.secure_script_branch || 'main' }}"
          $Url = "https://raw.githubusercontent.com/KnifeXRage/Godot-Secure/$Branch/Godot%20Secure%20Camellia-256.py"
          Invoke-WebRequest -Uri $Url -OutFile "Godot_Secure_Camellia_256.py"

      - name: Download encryption key
        uses: actions/download-artifact@v4
        with:
          name: encryption-key
          path: .

      - name: Run Godot Secure
        shell: pwsh
        env:
          SCRIPT_AES256_ENCRYPTION_KEY: ${{ needs.generate-key.outputs.encryption_key }}
        run: |
          (Get-Content Godot_Secure_Camellia_256.py) -replace 'sys.exit\(1\)', 'sys.exit(0)' | Set-Content Godot_Secure_Camellia_256.py
          echo "y" | python Godot_Secure_Camellia_256.py

      - name: Build Template
        shell: bash
        run: scons platform=windows target=template_release use_llvm=yes use_mingw=yes

      - name: Upload Template Artifact
        uses: actions/upload-artifact@v4
        with:
          name: godot-template-windows
          path: bin/
