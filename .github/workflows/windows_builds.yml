name: 🏁 Windows Builds

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        target: [editor, template_release]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup SCons
        run: pip install scons

      - name: Build ${{ matrix.target }}
        run: scons platform=windows target=${{ matrix.target }} d3d12=no

      - name: Upload ${{ matrix.target }} artifact
        uses: actions/upload-artifact@v4
        with:
          name: godot-${{ matrix.target }}-windows
          path: bin/