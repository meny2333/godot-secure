name: Linux Builds

on:
  workflow_call:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        target: [editor, template_release]

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 2 # 2 needed for Get changed files; no trivial way to conditionally use 1

      # Keep in sync with static_checks.yml
      - name: Get changed files
        if: matrix.clang-tidy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            files=$(git diff-tree --no-commit-id --name-only -r HEAD^1..HEAD 2> /dev/null || true)
          elif [ "${{ github.event_name }}" == "push" -a "${{ github.event.forced }}" == "false" -a "${{ github.event.created }}" == "false" ]; then
            files=$(git diff-tree --no-commit-id --name-only -r ${{ github.event.before }}..${{ github.event.after }} 2> /dev/null || true)
          fi
          files=$(echo "$files" | xargs -I {} sh -c 'echo "\"./{}\""' | tr '\n' ' ')
          echo "CHANGED_FILES=$files" >> $GITHUB_ENV

      - name: Setup dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwayland-bin scons

      - name: Load Encryption Key
        id: load_key
        run: |
          if [ ! -f godot.gdkey ]; then
            echo "错误：找不到 godot.gdkey 文件"
            exit 1
          fi
          
          key=$(cat godot.gdkey | tr -d '[:space:]')
          
          if [ ${#key} -ne 64 ]; then
            echo "错误：密钥长度不正确。期望64字符，实际 ${#key} 字符"
            exit 1
          fi
          
          if ! [[ "$key" =~ ^[0-9a-fA-F]{64}$ ]]; then
            echo "错误：密钥包含无效字符，必须是64位十六进制字符串"
            exit 1
          fi
          
          key=$(echo "$key" | tr '[:upper:]' '[:lower:]')
          
          echo "SCRIPT_AES256_ENCRYPTION_KEY=$key" >> $GITHUB_ENV
          
          masked="${key:0:8}...${key: -8}"
          echo "密钥验证通过：$masked (长度: ${#key})"
          echo "key_loaded=true" >> $GITHUB_OUTPUT

      - name: Verify Key Transfer
        run: |
          if [ -z "$SCRIPT_AES256_ENCRYPTION_KEY" ]; then
            echo "错误：SCRIPT_AES256_ENCRYPTION_KEY 环境变量未设置"
            exit 1
          fi
          
          key="$SCRIPT_AES256_ENCRYPTION_KEY"
          
          if [ ${#key} -ne 64 ]; then
            echo "错误：环境变量中的密钥长度不正确"
            exit 1
          fi
          
          masked="${key:0:8}...${key: -8}"
          echo "环境变量验证通过：$masked (长度: ${#key})"
          echo "密钥传递成功，准备开始构建..."

      - name: Build ${{ matrix.target }}
        run: |
          echo "开始构建 ${{ matrix.target }}..."
          echo "使用加密密钥构建模板（支持加密PCK解密）"
          
          scons platform=linuxbsd target=${{ matrix.target }} script_encryption_key="$SCRIPT_AES256_ENCRYPTION_KEY"

      - name: Verify Build Output
        run: |
          binPath="bin/"
          if [ ! -d "$binPath" ]; then
            echo "错误：构建目录不存在"
            exit 1
          fi
          
          files=$(find "$binPath" -type f)
          if [ -z "$files" ]; then
            echo "错误：未找到构建产物"
            exit 1
          fi
          
          echo "构建产物列表："
          for f in $files; do
            size=$(du -h "$f" | cut -f1)
            echo "  - $(basename $f) ($size)"
          done
          
          exePattern="godot.*linuxbsd.*${{ matrix.target }}"
          if ! ls $binPath | grep -qE "$exePattern"; then
            echo "警告：未找到匹配模式 $exePattern 的可执行文件"
          else
            echo "找到可执行文件：$(ls $binPath | grep -E $exePattern)"
          fi

      - name: Prepare artifact
        run: |
          strip bin/godot.*
          chmod +x bin/godot.*

      - name: Upload ${{ matrix.target }} artifact
        uses: actions/upload-artifact@v4
        with:
          name: godot-${{ matrix.target }}-linux
          path: bin/
          if-no-files-found: error
